name: Update Profile SVGs

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/generate_profile_svgs.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate SVGs
        run: python3 scripts/generate_profile_svgs.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tech-stack.svg assets/skill-dna.svg
          git diff --cached --quiet || git commit -m "chore: regenerate tech-stack and skill-dna SVGs [skip ci]"
          git push
